name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  contract:
    name: Contract (Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts
      - name: Setup Rust
        run: |
          rustup update stable
          rustup target add wasm32v1-none
      - name: Format Check
        run: cargo fmt --all -- --check
        working-directory: contracts
      - name: Clippy Lint
        run: cargo clippy --all-targets -- -D warnings
        working-directory: contracts
      - name: Unit Tests
        run: cargo test
      # Contract address is verified post-deploy via scripts/verify-contract.sh
        working-directory: contracts
      - name: Build WASM
        run: cargo build --release --target wasm32v1-none -p inflow
        working-directory: contracts

  sdk:
    name: SDK (TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install
      - run: npm run build --workspace=sdk

  workers:
    name: Workers (TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install
      - run: npm run build --workspace=workers
