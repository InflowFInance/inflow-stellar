name: inflow_web
description: "inFlow Stellar — Flutter Web frontend for real-time salary streaming"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.12.2 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  riverpod: ^3.4.2
  flutter_riverpod: ^3.4.2
  http: ^1.2.0
  flutter_web_plugins:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  plugin:
    platforms:
      web:
        pluginClass: InflowWebPlugin
        fileName: inflow_web_plugin.dart
