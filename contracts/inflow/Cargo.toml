[package]
name = "inflow"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/InflowFinance/inflow-stellar"

[lib]
crate-type = ["cdylib"]

[dependencies]
soroban-sdk = { version = "21.7.0", features = ["alloc"] }

[dev-dependencies]
soroban-sdk = { version = "21.7.0", features = ["alloc", "testutils"] }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
